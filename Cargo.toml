[package]
name = "awsprofile"
version = "0.1.0"
edition = "2024"
authors = ["Stijn Caerts"]
description = "TUI application that helps you select and source AWS profiles with fuzzy matching."
readme = "README.md"
catecategories = ["command-line-utilities"]
license = "Apache-2.0"
homepage = "https://github.com/StijnCaerts/awsprofile"
repository = "https://github.com/StijnCaerts/awsprofile"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
configparser = "3.0"
dirs = "7.0"
skim = "5.7.4"
clap = { version = "4.6.7", features = ["derive"] }
